<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oversized Logo Tee — Fresh</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Fresh</a>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="Shop.html" aria-current="page">Shop</a></li>
        <li><a href="Lookbook.html">Lookbook</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
    </nav>
    <div class="nav-icons">
      <a href="#" aria-label="Account">Account</a>
      <a href="#" aria-label="Cart">Cart (0)</a>
    </div>
    <button type="button" class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <section>
    <div class="product-layout">
      <div class="product-gallery">
        <img class="thumb art-product" src="images/tee.svg" alt="Black oversized logo tee" width="800" height="1000" loading="eager">
        <img class="thumb art-product" src="images/tee-detail.svg" alt="Oversized tee detail" width="800" height="1000" loading="lazy">
        <img class="thumb art-product" src="images/brand.svg" alt="Fresh tee branding detail" width="1000" height="750" loading="lazy">
      </div>
      <div class="product-info">
        <h1>Oversized logo tee</h1>
        <p class="price">R450</p>
        <p class="desc">A relaxed-fit cotton tee with the signature Fresh logo. Easy to style, built for everyday wear.</p>
        <h3>Choose a size</h3>
        <div class="size-row" aria-label="Choose a size">
          <button type="button" aria-pressed="false">S</button>
          <button type="button" aria-pressed="true">M</button>
          <button type="button" aria-pressed="false">L</button>
          <button type="button" aria-pressed="false">XL</button>
        </div>
        <button type="button" class="btn">Add to cart</button>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>&copy; 2026 Fresh. All rights reserved.</p>
    <nav class="footer-links">
      <a href="Shop.html">Shop</a>
      <a href="Lookbook.html">Lookbook</a>
      <a href="about.html">Contact</a>
      <a href="https://www.instagram.com/">Instagram</a>
    </nav>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
